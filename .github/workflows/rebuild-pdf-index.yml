name: Rebuild PDF index

on:
  push:
    branches:
      - main
    paths:
      - "火警圖 PDF/**/*.pdf"
      - "scripts/build-index.js"
      - "scripts/build-pdf-history.js"
      - "package.json"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Rebuild index data
        run: |
          npm run build:index
          npm run build:pdf-history

      - name: Commit rebuilt data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buildings.json data/fire-map-index.json data/pdf-update-history.json
          if git diff --cached --quiet; then
            echo "No index changes to commit."
          else
            git commit -m "Rebuild PDF index"
            git push
          fi
